meta:
  version: 3
  flow: Chip
  substituting_steps:

    # Render the layout after sealring insertion
    KLayout.Render: null
    +KLayout.SealRing: KLayout.Render

    # Disable KLayout DRC
    #KLayout.DRC: null
    #Checker.KLayoutDRC: null

    # Disable KLayout antenna check
    #KLayout.Antenna: null
    #Checker.KLayoutAntenna: null

    # Disable KLayout density check
    #KLayout.Density: null
    #Checker.KLayoutDensity: null

    # Save time during development
    # Enable for sign-off
    #OpenROAD.IRDropReport: null
    #Magic.DRC: null
    #Checker.MagicDRC: null
    #KLayout.XOR: null
    #Netgen.LVS: null
    #Checker.LVS: null

DESIGN_NAME: chip_top
VERILOG_FILES:
- dir::../src/chip_top.sv
- dir::../src/chip_core.sv
- dir::../src/smaesh_driver.sv
# The masked AES core the driver wraps. This is the flattened SMAesH tree
# produced by `nix build .#smaesh-hdl` (the Makefile's smaesh-hdl target),
# which the `result` symlink points at -- it is a build artifact, not
# checked in, so build it before running the flow. `dir::` globs.
- dir::../result/hdl/*.sv
- dir::../result/hdl/*.v

VERILOG_INCLUDE_DIRS:
- dir::../src
- dir::../result/hdl

# Read the RTL with the slang plugin rather than yosys' own Verilog frontend.
# Not optional once SMAesH is in the design: librelane passes `-noautowire`
# to every `read_verilog`, which forces `default_nettype none` globally, and
# SMAesH's HDL leans on implicit net declarations
# (e.g. MSKdata_holder_low_level.sv:65, `stage_out` inside a generate block).
# The slang path does not pass that flag.
USE_SLANG: True

# Buffer high-fanout nets during synthesis instead of leaving them to
# Detailed Routing.
SYNTH_ABC_BUFFERING: True

# Switching to slang did surface one further problem, now fixed in
# nix/smaesh-hdl.nix rather than here: six SMAesH modules carry a
# fullverif/matchi annotation on the module declaration whose value is the
# module's own `d` parameter, e.g.
#   (* fv_prop = "PINI", fv_strat = "composite", fv_order=d *)
#   module MSKnor_hpc2 #(parameter integer d=2) (...);
# The attribute elaborates in the enclosing scope, where `d` does not exist.
# Yosys' own frontend never evaluated attribute values and so never noticed;
# slang does, and failed the whole compilation with
#   error: use of undeclared identifier 'd'
# The generator now wraps those six in the `ifdef FULLVERIF / `ifdef MATCHI
# guards the rest of the tree already uses, so the formal flows still see
# them and the synthesis read does not.

SLANG_ARGUMENTS:
- --keep-hierarchy

# Flatten, but pin the boundaries that matter. `keep` (never flatten) is the
# safe default for a masked design, but it is expensive: measured on the same
# die, `keep` cost +31.9% core cell area over `flatten` + a targeted pin list
# (2,273,163 -> 2,997,120 um^2), took max-fanout violations from 103 to 269 and
# so made repair_design insert 19,342 buffers instead of 8,273. Detailed
# placement then could not legalise 3,535 of them and the run died with
# DPL-0036 in RepairDesignPostGPL (see failed-run2/).
#
# Note `SYNTH_KEEP_HIERARCHY_*` is only consulted when SYNTH_HIERARCHY_MODE is
# a flattening mode -- librelane sets the `keep_hierarchy` attribute and then
# runs yosys' `flatten`, which skips modules carrying it.
SYNTH_HIERARCHY_MODE: flatten

# Which boundaries survive the flatten. Because USE_SLANG is on and slang gets
# `--keep-hierarchy` above, slang specialises one module per instance and names
# it `<Module>$<full.instance.path>`; a bare module name matches nothing and
# warns "Selection ... did not match any module", so every pattern needs a
# trailing `*`.
SYNTH_KEEP_HIERARCHY_MODULES:

# 1. The four evaluation cores. Keeping these stops synthesis merging or
#    sharing logic between the d=2 and d=3 implementations, which would make
#    the area/power comparison between them meaningless. Everything *below*
#    them is flattened, so the intermediate plumbing (MSKaes_32bits_core, the
#    fsm, the key/state datapaths, MSKaesMC, ...) is optimised freely.
- "smaesh_hpc$chip_top.i_chip_core.driver.aes_core_m2*"
- "smaesh_hpc$chip_top.i_chip_core.driver.aes_core_m3*"
- "gen_sbox$chip_top.i_chip_core.driver.sbox_m2*"
- "gen_sbox$chip_top.i_chip_core.driver.sbox_m3*"

# 2. The HPC masking gadget leaves. These are NOT flattened even though they
#    sit below the cores: the probing-security argument for HPC depends on the
#    gadget boundary surviving synthesis, and flattening lets ABC recombine
#    shares across it and strip the register stages that block glitch
#    propagation. Only `bin_REG` (module attribute) and `gen_sbox`'s `sb_inst`
#    (instance attribute) carry `keep_hierarchy` in the SMAesH source; every
#    gadget below relies on this list. This is the same set the last run that
#    completed the flow (RUN_2026-11-09_16-27-59) used.
#
#    To flatten strictly everything below the cores, delete this block -- but
#    that un-protects the masking, so do it only for an area experiment you do
#    not intend to tape out.
- "MSKg4mul_hpc3*"
- "MSKg16mul_hpc3*"
- "bin_REG*"
- "MSKxor*"
- "MSKinv*"
- "MSKcst*"
- "MSKmux*"
- "MSKreg*"          # also matches MSKregEn, which is intended
- "MSKbit0_sharing*"
- "MSKrefresh_tree*"

RUN_POST_GRT_DESIGN_REPAIR: true
RUN_POST_GRT_RESIZER_TIMING: true
# This flag crashes during Global Placement
# PL_TIMING_DRIVEN: true

# The gf180mcu dly* cells have the same drive strength and max_cap as buf_1,
# differing only by a fixed intrinsic delay (dlyb_1: +1.3 ns). OpenROAD ranks
# buffers by drive resistance and so cannot tell them apart, and repair_design
# picked dlyb_1 for all 782 of its load-splitting buffers. Hold repair uses
# dlyc_* separately, so leave that family alone.
EXTRA_EXCLUDED_CELLS:
- gf180mcu_fd_sc_mcu7t5v0__dlya_*
- gf180mcu_fd_sc_mcu7t5v0__dlyb_*

# Slightly smaller file sizes
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# SDC files
PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC: dir::chip_top.sdc

# Power / ground nets
VDD_NETS:
- VDD
GND_NETS:
- VSS

# We need to add gf180mcu_fd_io__bi_24t
# due to the unused Y output for output only pads
IGNORE_DISCONNECTED_MODULES:
- gf180mcu_fd_io__bi_24t
- gf180mcu_ws_ip__qrcode_id
- gf180mcu_ws_ip__shuttle_id
- gf180mcu_ws_ip__project_id
- gf180mcu_ws_ip__logo
- gf180mcu_ws_ip__marker

# Clock
CLOCK_PORT: clk_PAD
CLOCK_NET: clk_pad/Y
CLOCK_PERIOD: 50 # 20 MHz

# Overfix hold violations
PL_RESIZER_HOLD_SLACK_MARGIN: 0.35
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.3

# Increase density for more 
# logic on your die
PL_TARGET_DENSITY_PCT: 75
GRT_ALLOW_CONGESTION: true

# Allow a larger Y displacement
PL_MAX_DISPLACEMENT_Y: 200

# Fix antenna violations after DRT
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10 # %

# PDN
PDN_CFG: dir::pdn/pdn_cfg.tcl
PDN_ENABLE_PINS: False

# PDN - Straps
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75

# PDN - Core ring
PDN_CORE_RING: True
# Maximum metal width without slotting: 30um
PDN_CORE_RING_VWIDTH: 25
PDN_CORE_RING_HWIDTH: 25
PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_CORE_VERTICAL_LAYER: Metal4
PDN_CORE_HORIZONTAL_LAYER: Metal3
PDN_CORE_RING_CONNECT_TO_PAD_LAYERS: [Metal2]

# Do not error on magic DRC violations
# Note: Passing magic DRC is not required for the submission.
# However, it is recommended to fix or carefully review all violations.
ERROR_ON_MAGIC_DRC: False

# Prevent false positive DRC errors in I/O cells
MAGIC_GDS_FLATGLOB:
# For contacts
- "*_CDNS_*"

# Since we cannot meet the minimum density limit on Metal2,
# ignore active metal on previous and subsequent layers
# (DM.5_DM.7 and DM.4_DM.6). Dummy metal is moved to active
# metal during the precheck.
KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true

# Because we have multiple power pads for one power domain
MAGIC_EXT_UNIQUE: notopports

# Image render settings
KLAYOUT_RENDER_RESOLUTION: 2048
KLAYOUT_RENDER_OVERSAMPLING: 3
KLAYOUT_PROPERTIES: dir::gf180mcu_render.lyp

# DRC settings
# A high number of workers increases RAM usage,
# but can significantly improve the performance.
# workers * threads should equal the available
# hardware threads for a best possible utilization.

KLAYOUT_DRC_THREADS: 1

# "max" equals max hardware threads
KLAYOUT_DRC_OPTIONS:
  decks: "all,-antenna,-density,-cup" # disable CUP for now
  variant: ref::$PDK
  workers: max

KLAYOUT_DENSITY_OPTIONS:
  decks: "density"
  variant: ref::$PDK
  workers: max

KLAYOUT_ANTENNA_OPTIONS:
  decks: "antenna"
  variant: ref::$PDK
  workers: max
