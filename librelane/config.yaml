meta:
  version: 3
  flow: Chip
  substituting_steps:

    # Render the layout after sealring insertion
    KLayout.Render: null
    +KLayout.SealRing: KLayout.Render

    # Disable KLayout DRC
    #KLayout.DRC: null
    #Checker.KLayoutDRC: null

    # Disable KLayout antenna check
    #KLayout.Antenna: null
    #Checker.KLayoutAntenna: null

    # Disable KLayout density check
    #KLayout.Density: null
    #Checker.KLayoutDensity: null

    # Save time during development
    # Enable for sign-off
    #OpenROAD.IRDropReport: null
    #Magic.DRC: null
    #Checker.MagicDRC: null
    #KLayout.XOR: null
    #Netgen.LVS: null
    #Checker.LVS: null

DESIGN_NAME: chip_top
VERILOG_FILES:
- dir::../src/chip_top.sv
- dir::../src/chip_core.sv
- dir::../src/smaesh_driver.sv
# The masked AES core the driver wraps. This is the flattened SMAesH tree
# produced by `nix build .#smaesh-hdl` (the Makefile's smaesh-hdl target),
# which the `result` symlink points at -- it is a build artifact, not
# checked in, so build it before running the flow. `dir::` globs.
- dir::../result/hdl/*.sv
- dir::../result/hdl/*.v

VERILOG_INCLUDE_DIRS:
- dir::../src
- dir::../result/hdl

# Read the RTL with the slang plugin rather than yosys' own Verilog frontend.
# Not optional once SMAesH is in the design: librelane passes `-noautowire`
# to every `read_verilog`, which forces `default_nettype none` globally, and
# SMAesH's HDL leans on implicit net declarations
# (e.g. MSKdata_holder_low_level.sv:65, `stage_out` inside a generate block).
# The slang path does not pass that flag.
USE_SLANG: True

# STILL BLOCKED after enabling slang: synthesis stops in Yosys.Synthesis with
#   error: use of undeclared identifier 'd'
# on ~60 sites across 41 files of the SMAesH tree, e.g.
#   (* fv_prop = "PINI", fv_strat = "composite", fv_order=d *)
#   (* matchi_prop="PINI", matchi_strat="composite_top", matchi_shares=d *)
# These are annotations for SMAesH's own formal-verification tooling
# (fullverif / matchi) that reference the module's `d` parameter. Yosys' own
# frontend tolerated them; slang does not accept a parameter reference there.
#
# Synthesis ignores attributes, so stripping them from the generated tree
# does not change the circuit -- the natural place is the installPhase of
# nix/smaesh-hdl.nix, which is where that tree is assembled. Not done here
# because the same tree is what SMAesH's formal flows read, so it is worth
# deciding deliberately rather than as a side effect of this wiring change.

# ---------------------------------------------------------------------------
# UNRESOLVED: hierarchy preservation for the masked core
# ---------------------------------------------------------------------------
# SMAesH's side-channel security rests on its HPC gadgets (the MSK* modules)
# keeping the shares of a value separate. That is a property of the gate-level
# netlist, not of the RTL: a synthesiser free to optimise across a gadget
# boundary can recombine shares into a single gate and silently reintroduce
# the leakage the masking exists to remove.
#
# SYNTH_HIERARCHY_MODE defaults to 'flatten', so the flow as configured here
# WILL flatten the gadgets. SMAesH's own synth/synth.tcl never flattens.
#
# This has not been decided yet -- it trades area and timing on a small slot
# against the masking being worth anything, and it wants checking against
# SMAesH's formal_verif/ tooling rather than just being switched on. Pick one:
#
#   # Keep every boundary, closest to SMAesH's own flow:
#   SYNTH_HIERARCHY_MODE: keep
#
#   # Or flatten everything except the gadgets:
#   SYNTH_KEEP_HIERARCHY_MODULES: [MSKand_hpc2, MSKreg, MSKregEn, ...]
# ---------------------------------------------------------------------------

# Slightly smaller file sizes
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# SDC files
PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC: dir::chip_top.sdc

# Power / ground nets
VDD_NETS:
- VDD
GND_NETS:
- VSS

# We need to add gf180mcu_fd_io__bi_24t
# due to the unused Y output for output only pads
IGNORE_DISCONNECTED_MODULES:
- gf180mcu_fd_io__bi_24t
- gf180mcu_ws_ip__qrcode_id
- gf180mcu_ws_ip__shuttle_id
- gf180mcu_ws_ip__project_id
- gf180mcu_ws_ip__logo
- gf180mcu_ws_ip__marker

# Clock
CLOCK_PORT: clk_PAD
CLOCK_NET: clk_pad/Y
CLOCK_PERIOD: 40 # 25 MHz

# Overfix hold violations
PL_RESIZER_HOLD_SLACK_MARGIN: 0.35
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.3

# Increase density for more 
# logic on your die
PL_TARGET_DENSITY_PCT: 35
GRT_ALLOW_CONGESTION: true

# Allow a larger Y displacement
PL_MAX_DISPLACEMENT_Y: 200

# Fix antenna violations after DRT
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10 # %

# PDN
PDN_CFG: dir::pdn/pdn_cfg.tcl
PDN_ENABLE_PINS: False

# PDN - Straps
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75

# PDN - Core ring
PDN_CORE_RING: True
# Maximum metal width without slotting: 30um
PDN_CORE_RING_VWIDTH: 25
PDN_CORE_RING_HWIDTH: 25
PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_CORE_VERTICAL_LAYER: Metal4
PDN_CORE_HORIZONTAL_LAYER: Metal3
PDN_CORE_RING_CONNECT_TO_PAD_LAYERS: [Metal2]

# Do not error on magic DRC violations
# Note: Passing magic DRC is not required for the submission.
# However, it is recommended to fix or carefully review all violations.
ERROR_ON_MAGIC_DRC: False

# Prevent false positive DRC errors in I/O cells
MAGIC_GDS_FLATGLOB:
# For contacts
- "*_CDNS_*"
# Foundry provided SRAMs
- "*$$*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "pmos_5p0*"
- "pmos_1p2*"
- "via1_*"
- "ypass_gate*"
- "G_ring_*"
# These additional cells must be flattened to get rid of 3.3V devices
# (DUALGATE drawn into high-level cells)
- "dcap_103*"
- "din_*"
- "mux821_*"
- "rdummy_*"
- "pmoscap_*"
- "xdec_*"
- "ypredec*"
- "xpredec*"
- "prexdec_*"
- "xdec8_*"
- "xdec16_*"
- "xdec32_*"
- "sa_*"

# Since we cannot meet the minimum density limit on Metal2,
# ignore active metal on previous and subsequent layers
# (DM.5_DM.7 and DM.4_DM.6). Dummy metal is moved to active
# metal during the precheck.
KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true

# Because we have multiple power pads for one power domain
MAGIC_EXT_UNIQUE: notopports

# Image render settings
KLAYOUT_RENDER_RESOLUTION: 2048
KLAYOUT_RENDER_OVERSAMPLING: 3
KLAYOUT_PROPERTIES: dir::gf180mcu_render.lyp

# DRC settings
# A high number of workers increases RAM usage,
# but can significantly improve the performance.
# workers * threads should equal the available
# hardware threads for a best possible utilization.

KLAYOUT_DRC_THREADS: 1

# "max" equals max hardware threads
KLAYOUT_DRC_OPTIONS:
  decks: "all,-antenna,-density,-cup" # disable CUP for now
  variant: ref::$PDK
  workers: max

KLAYOUT_DENSITY_OPTIONS:
  decks: "density"
  variant: ref::$PDK
  workers: max

KLAYOUT_ANTENNA_OPTIONS:
  decks: "antenna"
  variant: ref::$PDK
  workers: max
