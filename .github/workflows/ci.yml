name: CI

# Events that trigger the workflow
on:
  # Runs on all pushes to branches
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  # Runs on all PRs
  pull_request:
  # Manual Dispatch
  workflow_dispatch:

concurrency:
  # Behavior:
  # - Group all pull requests: latest push cancels previous ones
  # - Group all branches:
  #   - If main/version- branches: run serially
  #   - Else, latest push cancels previous ones
  group: >
    ${{
      (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)) ||
      (github.event_name == 'push' && format('branch-{0}', github.ref_name)) ||
      ''
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || !(startsWith(github.ref_name, 'version-') || github.ref_name == 'main' || github.ref_name == 'dev') }}

# This workflow only reads the repository and uploads artifacts; it never
# pushes, comments or writes checks. Declaring it here means the token handed
# to every job starts read-only rather than at the repository default.
permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Define the Matrix
        id: export-matrix
        run: |
          if ${{ github.repository == 'wafer-space/gf180mcu-project-template' }}; then
            echo "matrix={\"slot\":['1x1', '0p5x1', '1x0p5', '0p5x0p5'],\"domain\":['5v','3v3'],\"include\": [{\"pad\": 'gf180mcu_fd_io', \"domain\": '5v'},{\"scl\": 'gf180mcu_fd_sc_mcu7t5v0', \"domain\": '5v'},{\"sram\": 'gf180mcu_fd_ip_sram', \"domain\": '5v'},{\"pad\": 'gf180mcu_ocd_io', \"domain\": '3v3'},{\"scl\": 'gf180mcu_as_sc_mcu7t3v3', \"domain\": '3v3'},{\"sram\": 'gf180mcu_ocd_ip_sram', \"domain\": '3v3'}]}" >> $GITHUB_OUTPUT
          else
            echo "matrix={\"slot\":['default'],\"domain\":['default'],\"sram\":['default'],\"pad\":['default'],\"scl\":['default']}" >> $GITHUB_OUTPUT
          fi
    outputs:
      matrix: ${{ steps.export-matrix.outputs.matrix }}
  chip:
    runs-on: ubuntu-24.04
    name: Build the Chip
    needs:
      - prepare
    strategy:
      matrix: ${{fromJSON(needs.prepare.outputs.matrix)}}
    steps:
      # Through `env:` rather than expanded straight into the script: a
      # `${{ ... }}` in a `run:` block is substituted before the shell parses
      # the line, so the matrix values would be shell source rather than
      # data. They are maintainer-defined here, but the indirection costs
      # nothing and keeps the pattern consistent across the repository.
      - name: Set variables
        env:
          MATRIX_SLOT: ${{ matrix.slot }}
          MATRIX_SRAM: ${{ matrix.sram }}
          MATRIX_PAD: ${{ matrix.pad }}
          MATRIX_SCL: ${{ matrix.scl }}
        # zizmor: ignore[github-env]
        # Deliberate: these select the PDK libraries for the steps below,
        # and come from the matrix defined in this file.
        run: |
          echo "SLOT=$MATRIX_SLOT" >> "$GITHUB_ENV"
          echo "SRAM=$MATRIX_SRAM" >> "$GITHUB_ENV"
          echo "PAD=$MATRIX_PAD" >> "$GITHUB_ENV"
          echo "SCL=$MATRIX_SCL" >> "$GITHUB_ENV"
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
      - uses: actions/checkout@v6
        with:
          # Not `recursive`: SMAesH pins its own sboxes-compress/compress
          # submodule over SSH, which a runner has no key for. The flake
          # fetches that source itself, over https.
          submodules: true
          # Without this, the checkout leaves the job's token in
          # .git/config, where every later step (and anything they run) can
          # read it. Nothing below needs to talk to the remote.
          persist-credentials: false
      - name: Setup Nix
        uses: ./.github/actions/setup_nix
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          nix_cache_domain: ${{ vars.NIX_CACHE }}
          nix_public_key: ${{ vars.NIX_PUBLIC_KEY }}
      - name: Build with Nix
        uses: ./.github/actions/build_nix
        with:
          nix_system: x86_64-linux
      - name: Check Nix
        run: |
          sudo du -hs /nix/store/* | sort -h | tail -n 10
          sudo tree /nix/store/*-librelane || true
      - name: Clone the PDK
        run: |
          nix develop --command make clone-pdk
      - name: Run RTL simulation
        run: |
          # cocotb returns 0 even when tests fail, so the XML report is what
          # decides. Checked by script rather than `! grep failure ...`:
          # grep exits 2 on a missing file, which `!` would turn into a pass
          # for a run that crashed before writing any result at all.
          nix develop --command make sim
          nix develop --command python3 scripts/check_sim_results.py cocotb/sim_build/results.xml
      - name: Implement the Chip
        if: success() || failure()
        run: |
          nix develop --command make librelane-condensed
      - name: Create summary
        if: success() || failure()
        run: |
          echo "# Manufacturability" >> $GITHUB_STEP_SUMMARY
          cat librelane/runs/*/*-misc-reportmanufacturability/manufacturability.rpt >> $GITHUB_STEP_SUMMARY
      - name: Print the hash
        if: success() || failure()
        run: |
          shasum final/gds/*
      - name: Upload GDS
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.slot }}_${{ matrix.domain }}_gds
          path: final/gds/*
      - name: Upload image
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.slot }}_${{ matrix.domain }}_image
          path: final/render/*.png
      - name: Run GL simulation
        if: success() || failure()
        run: |
          # See the note on the RTL simulation step above.
          nix develop --command make sim-gl
          nix develop --command python3 scripts/check_sim_results.py cocotb/sim_build/results.xml
