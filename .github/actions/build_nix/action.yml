name: Build LibreLane with Nix
description: Builds default devShell for a platform, caching the results (if applicable)
inputs:
  shell:
    description: "Shell to use"
    required: true
    default: "bash"
  nix_system:
    description: "The nix platform string to build for"
    required: true
    default: "x86_64-linux"
runs:
  using: "composite"
  steps:
    - id: Build
      name: Build
      shell: ${{ inputs.shell }}
      # Via the environment rather than expanded into the script: see the
      # note in ../setup_nix/action.yml.
      env:
        NIX_SYSTEM: ${{ inputs.nix_system }}
      run: |
        echo "#################################################################"
        outPath=$(nix build\
          --print-out-paths\
          --no-link\
          --accept-flake-config\
          --option system "$NIX_SYSTEM"\
          --extra-platforms "$NIX_SYSTEM"\
          ".#devShells.$NIX_SYSTEM.default")
        echo "out-path=$outPath" >> "$GITHUB_OUTPUT"
        sudo du -hs /nix/store/* | sort -h | tail -n 20
